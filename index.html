<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>永續相關財務資訊專章工作台</title><style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#183b36;background:#f3f7f5}*{box-sizing:border-box}body{margin:0}header{background:#123f38;color:white;padding:23px 4vw}header h1{font-size:24px;margin:0}header small{color:#b5d8cc}main{max-width:1440px;margin:auto;padding:24px;display:grid;grid-template-columns:245px 1fr;gap:22px}aside,.panel{background:white;border:1px solid #dce8e3;border-radius:15px;padding:19px}aside{height:fit-content;position:sticky;top:16px}h2{font-size:20px;margin:0 0 14px}h3{font-size:16px}button{cursor:pointer;background:#176c5d;color:white;border:0;border-radius:9px;padding:10px 14px;margin:4px 4px 4px 0}button.alt{background:#e7f1ed;color:#175b50}button:disabled{opacity:.45}input,select,textarea{width:100%;padding:10px;border:1px solid #cbdcd5;border-radius:8px;margin:5px 0 12px;font:inherit}textarea{min-height:230px}nav button{display:block;width:100%;text-align:left;background:transparent;color:#234b43;padding:12px}nav button.active{background:#e4f2ed;color:#075b48;font-weight:700}.panel{margin-bottom:16px}.muted{color:#617b72;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#eaf5f0;border-radius:12px;padding:16px}.stat strong{display:block;font-size:24px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}.hidden{display:none}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e4ece9;vertical-align:top}th{background:#f0f6f3}.tag{border-radius:5px;padding:3px 6px;background:#eaf1ef;font-size:12px}.ok{color:#147c59}.warn{color:#a46615}.section{border:1px solid #e1eae6;border-radius:10px;padding:13px;margin:8px 0}.section button{font-size:12px}.scroll{overflow:auto;max-height:520px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;font-size:13px}#message{padding:10px;color:#176c5d}@media(max-width:850px){main{grid-template-columns:1fr}aside{position:static}.stats{grid-template-columns:1fr}}
</style><header><h1>ESG 永續相關財務資訊專章工作台</h1><small>單一五大章節架構 · 企業資料追溯 · 缺口檢核 · 人工確認</small></header><main><aside><h3>公司專案</h3><select id="projects" onchange="load()"></select><button onclick="create()">＋ 建立公司專案</button><button class="alt" id="deleteProjectButton" onclick="deleteCurrentProject()" style="color:#b42318;border:1px solid #e8b4ae">刪除目前公司專案</button><hr><nav id="nav"></nav><p class="muted">專案儲存在外部 PostgreSQL；仍須定期備份，免費方案不保證永久保存。參考文件僅用於設計架構，不作為企業證據。</p></aside><article><div id="message"></div><section id="overview" class="view"></section><section id="upload" class="view hidden"></section><section id="chapters" class="view hidden"></section><section id="checks" class="view hidden"></section><section id="sources" class="view hidden"></section><section id="requests" class="view hidden"></section><section id="clauses" class="view hidden"></section></article></main><script>
const views=[['overview','專案總覽'],['upload','批次上傳與辨識'],['chapters','五大章節編輯'],['checks','專章架構檢查'],['sources','證據與來源追溯'],['requests','客戶索資追蹤'],['clauses','S1／S2 條文檢核']];let current=null,data=null,selected='overview';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,options){let r;try{r=await fetch('/api'+path,options)}catch(e){throw Error('無法連接系統後端。請確認網站部署成功並重新整理頁面。')}let j;try{j=await r.json()}catch(e){throw Error('伺服器回傳異常，請檢查部署日誌。')}if(!r.ok)throw Error(j.error||'操作失敗');return j}function msg(s){$('message').textContent=s;setTimeout(()=>$('message').textContent='',5500)}function tab(k){selected=k;for(let [id] of views)$(id).classList.toggle('hidden',id!==k);$('nav').innerHTML=views.map(([id,label])=>`<button class="${id===k?'active':''}" onclick="tab('${id}')">${label}</button>`).join('')}async function init(){let ps=await api('/projects');$('projects').innerHTML=ps.map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.year)}</option>`).join('');if(ps.length){current=Number($('projects').value);await refresh()}else{tab('overview');$('overview').innerHTML='<div class="panel"><h2>尚無專案</h2><p>請點左側「建立公司專案」開始。</p></div>'}}async function deleteCurrentProject(){
 if(!current||!data?.project){alert('請先選擇公司專案');return}
 const p=data.project;
 if(!confirm(`確定要永久刪除「${p.name}」（${p.year}）嗎？\n\n這將一併刪除該公司的上傳來源、原始檔、解析證據、草稿、索資紀錄、條文檢核與 AI 建議。\n此操作無法復原。`))return;
 const typed=prompt(`請輸入公司名稱「${p.name}」以確認永久刪除：`);
 if(typed===null)return;
 if(typed!==p.name){alert('公司名稱不一致，已取消刪除。');return}
 const button=$('deleteProjectButton');button.disabled=true;
 try{
  await api('/projects/'+current,{method:'DELETE'});
  current=null;data=null;selected='overview';
  await init();
  msg('公司專案及其相關資料已刪除');
 }catch(e){alert('刪除失敗：'+e.message)}finally{button.disabled=false}
}
async function create(){let name=prompt('公司名稱（不得使用參考公司作為資料來源）');if(!name)return;let industry=prompt('產業別（選填）','')||'';let year=prompt('報導年度','2025')||'2025';try{let p=await api('/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,industry,year})});await init();$('projects').value=p.id;await load();tab('upload');msg('專案建立成功，下一步請上傳企業資料。')}catch(e){alert('建立專案失敗：'+e.message);msg(e.message)}}async function load(){current=Number($('projects').value);await refresh()}async function refresh(){if(!current)return;data=await api('/projects/'+current);render();await renderCompliance();tab(selected);await showAISuggestions()}function render(){let c=data.checks,n=c.length,has=c.filter(x=>x.evidence).length,generated=c.filter(x=>x.generated).length,confirmed=c.filter(x=>x.confirmed).length;
$('overview').innerHTML=`<div class="panel"><h2>${esc(data.project.name)}｜${esc(data.project.year)}</h2><p class="muted">產業：${esc(data.project.industry||'尚未設定')}。資料完整度與準則符合程度不可混用。</p><div class="stats"><div class="stat">參考架構項目<strong>${n}/${n}</strong><small>已建置章節，不代表已揭露</small></div><div class="stat">企業資料支持<strong>${has}/${n}</strong><small>僅為初步關鍵字分類，待人工審查</small></div><div class="stat">已人工確認<strong>${confirmed}/${n}</strong><small>準則符合程度：未評估</small></div></div><p>已生成可審閱內容：${generated}/${n}　｜　來源檔案：${data.sources.length}　｜　證據片段：${data.evidence.length}</p><button onclick="tab('upload')">上傳資料</button><button onclick="generate()">一鍵生成草稿</button><button class="alt" onclick="tab('checks')">檢查缺口</button><h3>匯出報告與補件清單</h3><button onclick="exportFile('docx')">Word</button><button onclick="exportFile('pdf')">PDF</button><button onclick="exportFile('xlsx')">Excel 缺口／來源</button><p class="muted">自動生成為來源摘錄式草稿，不是大型語言模型生成；不會憑空撰寫管理制度或宣稱 IFRS 合規。</p></div>`;
$('upload').innerHTML=`<div class="panel"><h2>批次上傳企業資料</h2><p>支援 PDF（文字型）、DOCX、XLSX、TXT、CSV、MD。可一次選擇多份；掃描影像、舊版 DOC、PPTX 尚不支援。</p><input id="files" type="file" multiple accept=".pdf,.docx,.xlsx,.xlsm,.txt,.csv,.md"><button onclick="uploadFiles()">解析並分類</button><p class="muted">來源檔案經 SHA-256 去重；解析後儲存原文片段、頁碼或工作表位置與分類信心。原始檔案保存至 PostgreSQL，並可下載；資料庫容量有限，請定期備份。</p></div><div class="panel"><h3>直接新增文字段落</h3><input id="textname" placeholder="來源名稱，例如：2025年氣候風險訪談"><textarea id="textbody" placeholder="貼上客戶訪談紀錄、文字敘述、數據說明等"></textarea><button onclick="addText()">儲存文字來源</button></div><div class="panel"><h3>已匯入檔案</h3>${data.sources.map(s=>`<div class="section"><b>#${s.id} ${esc(s.name)}</b><p class="muted">${esc(s.created)}</p><select id="srcstatus-${s.id}"><option value="yellow" ${s.status==='yellow'?'selected':''}>🟡 已上傳／待人工確認</option><option value="green" ${s.status==='green'?'selected':''}>🟢 人工已確認</option><option value="red" ${s.status==='red'?'selected':''}>🔴 有問題需修改</option></select><input id="srcnote-${s.id}" value="${esc(s.note)}" placeholder="審核備註或問題原因"><button onclick="saveSource(${s.id})">儲存燈號</button><button class="alt" onclick="window.location.href='/api/projects/'+current+'/sources/${s.id}/download'">下載原始檔</button><button class="alt" onclick="removeSource(${s.id})">刪除來源</button></div>`).join('')||'尚無檔案'}</div>`;
let chapters='';for(let [ch,[title,subs]] of Object.entries(data.structure)){chapters+=`<div class="panel"><h2>${ch}｜${title}</h2>`;subs.forEach((sub,i)=>{let k=ch+'.'+(i+1),r=data.drafts[k],count=c.find(x=>x.key===k)?.evidence||0;chapters+=`<div class="section"><div class="row"><strong>${k} ${esc(sub)}</strong><span class="tag">證據 ${count}</span><span class="tag">${r?.confirmed?'已確認':'待審核'}</span></div><pre>${esc((r?.body||'[尚未生成]').slice(0,350))}</pre><button class="alt" onclick="editSection('${k}')">編輯／確認</button></div>`});chapters+='</div>'}$('chapters').innerHTML=chapters;
$('checks').innerHTML=`<div class="panel"><h2>專章架構檢查</h2><p>參考架構完整度：${n}/${n}（系統模板）｜企業資料支持：${has}/${n}｜已確認：${confirmed}/${n}｜<b>IFRS S1/S2 符合程度：未評估</b></p><div class="scroll"><table><thead><tr><th>統一章節／揭露項目</th><th>企業證據</th><th>已生成</th><th>待補充</th><th>人工判斷</th><th>準則狀態</th></tr></thead><tbody>${c.map(x=>`<tr><td>${x.key} ${esc(x.title)}</td><td>${x.evidence} 筆</td><td>${x.generated?'是':'否'}</td><td>${x.needs_data?'缺來源':'待確認適用性'}</td><td>${x.confirmed?'完成':'待審核'}</td><td>未確認適用條文</td></tr>`).join('')}</tbody></table></div><p class="muted">本頁只做架構與資料缺口檢查；IFRS 準則條文及產業適用性需要專業逐項判斷，不能以章節有文字判定合規。</p></div>`;
$('sources').innerHTML=`<div class="panel"><h2>來源追溯與章節對應</h2><div class="scroll">${data.evidence.map(e=>`<div class="section"><strong>#${e.id} ${esc(e.filename)}</strong><p class="muted">${esc(e.location)}｜${e.category}｜信心 ${e.confidence}｜章節：${esc(e.sections.join(', ')||'未分類')}</p><pre>${esc(e.body.slice(0,500))}</pre><button class="alt" onclick="remap(${e.id})">修正章節對應</button><button class="alt" onclick="editEvidence(${e.id})">修改文字片段</button></div>`).join('')||'尚無證據'}</div></div>`}
async function uploadFiles(){let f=$('files').files;if(!f.length)return msg('請先選擇檔案');let fd=new FormData();for(let x of f)fd.append('files',x);try{let r=await api('/projects/'+current+'/upload',{method:'POST',body:fd});msg(r.results.map(x=>x.file+': '+(x.error||x.status)).join('；'));await refresh()}catch(e){msg(e.message)}}async function generate(){try{let r=await api('/projects/'+current+'/generate',{method:'POST'});msg(`已更新 ${r.updated} 節，已確認內容不覆蓋`);await refresh();tab('chapters')}catch(e){msg(e.message)}}function exportFile(fmt){window.location.href='/api/projects/'+current+'/export/'+fmt}async function editSection(k){let r=data.drafts[k]||{};let body=prompt('修改本節文字（按確定後儲存；請自行核對來源）',r.body||'');if(body===null)return;let confirmed=confirm('是否標示為「已人工確認」？\n請先確認內容與來源、適用性、期間與數值一致。');await api('/projects/'+current+'/sections/'+k,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({body,confirmed})});await refresh();tab('chapters')}async function remap(id){let e=data.evidence.find(x=>x.id===id);let s=prompt('以逗號分隔章節編號，例如 3.1,4.3',e.sections.join(','));if(s===null)return;await api('/projects/'+current+'/evidence/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({sections:s.split(',').map(x=>x.trim())})});await refresh();tab('sources')}

async function saveSource(id){try{await api('/projects/'+current+'/sources/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('srcstatus-'+id).value,note:$('srcnote-'+id).value})});msg('文件狀態已儲存');await refresh()}catch(e){alert(e.message)}}
async function removeSource(id){if(!confirm('確定刪除來源及其證據片段？既有草稿不會自動清除。'))return;try{await api('/projects/'+current+'/sources/'+id,{method:'DELETE'});await refresh();msg('來源已刪除，請檢查既有草稿及條文引用')}catch(e){alert(e.message)}}
async function addText(){let body=$('textbody').value.trim();if(!body)return alert('請輸入文字');try{await api('/projects/'+current+'/text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('textname').value,body})});await refresh();msg('文字已新增，預設黃燈')}catch(e){alert(e.message)}}
async function editEvidence(id){let e=data.evidence.find(x=>x.id===id);let body=prompt('編輯文字片段（綠燈來源需先改黃燈）',e.body);if(body===null)return;try{await api('/projects/'+current+'/evidence/'+id+'/text',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});await refresh();msg('文字已更新')}catch(e){alert(e.message)}}

async function renderCompliance(){
 const d=await api('/projects/'+current+'/compliance');
 const statuses={'missing':'未提供','received':'🟡 已上傳／待確認','confirmed':'🟢 已確認','issue':'🔴 有問題','not_applicable':'不適用'};
 const cs={'unreviewed':'未檢核','missing':'未揭露','partial':'部分揭露','complete':'人工確認已揭露','not_applicable':'不適用'};
 const sourceOptions=(selected)=>'<option value="">未指定</option>'+data.sources.map(s=>`<option value="${s.id}" ${String(selected)===String(s.id)?'selected':''}>#${s.id} ${esc(s.name)}</option>`).join('');
 $('requests').innerHTML=`<div class="panel"><h2>客戶索資追蹤</h2><p class="muted">${esc(d.version)}。文件狀態與條文符合性分開判斷；索資清單含額外顧問盡職調查項目，並非每項均為 IFRS 強制揭露。</p><div class="stats"><div class="stat">索資項目<strong>${d.summary.requests_total}</strong></div><div class="stat">尚未提供<strong>${d.summary.requests_missing}</strong></div><div class="stat">已收到／待確認<strong>${d.requests.filter(x=>x.status==='received').length}</strong></div></div><button onclick="exportCompliance()">下載索資＋條文檢核 Excel</button><div class="scroll"><table><thead><tr><th>編號／類別</th><th>索取資料及參考條文</th><th>狀態</th><th>對應來源</th><th>備註／待補內容</th><th>操作</th></tr></thead><tbody>${d.requests.map(x=>`<tr><td>${esc(x.code)}<p class="muted">${esc(x.group)}</p></td><td>${esc(x.title)}<p class="muted">${esc(x.clauses)}｜章節 ${esc(x.section)}</p></td><td><select id="reqs-${x.code}">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><select id="reqsrc-${x.code}">${sourceOptions(x.source_id)}</select></td><td><textarea id="reqnote-${x.code}" style="min-height:72px">${esc(x.note)}</textarea></td><td><button onclick="saveRequest('${x.code}')">儲存</button></td></tr>`).join('')}</tbody></table></div></div>`;
 $('clauses').innerHTML=`<div class="panel"><h2>IFRS S1／S2 條文檢核</h2><p class="muted">${esc(d.version)}。此處為重點條文檢核，不是完整條文清單。未檢核不等於不符合；已人工確認也不代表取得第三方確信。</p><div class="stats"><div class="stat">檢核群組<strong>${d.summary.clauses_total}</strong></div><div class="stat">人工確認已揭露<strong>${d.summary.clauses_complete}</strong></div><div class="stat">確認缺漏／部分揭露<strong>${d.summary.clauses_gaps}</strong></div></div><button onclick="runAI()">AI 分析文件並提出條文缺漏</button><p class="muted">AI 建議不會自動改為已確認，請人工核對。</p><div id="aiSuggestions"></div><button onclick="exportCompliance()">下載 Excel 補件清單</button><div class="scroll"><table><thead><tr><th>準則條文</th><th>揭露要求</th><th>人工判斷</th><th>來源文件（可填多個 ID）</th><th>缺漏／應向客戶索取</th><th>操作</th></tr></thead><tbody>${d.checks.map(x=>`<tr><td><b>${esc(x.code)}</b><p class="muted">章節 ${esc(x.section)}</p></td><td>${esc(x.title)}<p class="muted">${esc(x.requirement)}</p></td><td><select id="clstatus-${x.code}">${Object.entries(cs).map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><input id="clsrc-${x.code}" value="${esc(x.source_ids.join(','))}" placeholder="如 1,3"></td><td><textarea id="clnote-${x.code}" style="min-height:72px">${esc(x.note)}</textarea></td><td><button onclick="saveClause('${x.code}')">儲存</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
async function saveRequest(code){try{await api('/projects/'+current+'/compliance/request/'+code,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('reqs-'+code).value,source_id:$('reqsrc-'+code).value||null,note:$('reqnote-'+code).value})});msg('索資項目已儲存');await renderCompliance()}catch(e){alert(e.message)}}
async function saveClause(code){try{let raw=$('clsrc-'+code).value.trim();let ids=raw?raw.split(',').map(x=>Number(x.trim())):[];if(ids.some(x=>!Number.isInteger(x)||x<=0))throw Error('來源 ID 請輸入數字，以逗號分隔');await api('/projects/'+current+'/compliance/clause/'+encodeURIComponent(code),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('clstatus-'+code).value,source_ids:ids,note:$('clnote-'+code).value})});msg('條文檢核已儲存');await renderCompliance()}catch(e){alert(e.message)}}
async function runAI(){if(!confirm('將本專案的已解析文字片段傳送至 OpenAI API 進行分析，可能產生費用。請確認不含未授權傳送的機密資料。繼續？'))return;msg('正在分析，請稍候…');try{let r=await api('/projects/'+current+'/ai/analyze',{method:'POST'});msg(`AI 已分析 ${r.analyzed} 組條文，請人工審核`);await showAISuggestions()}catch(e){alert(e.message)}}
async function showAISuggestions(){let list=await api('/projects/'+current+'/ai/suggestions');let el=$('aiSuggestions');if(!el)return;el.innerHTML=list.length?'<h3>AI 初步建議（非符合性結論）</h3><div class="scroll"><table><tr><th>條文</th><th>初步判斷</th><th>來源證據</th><th>疑似缺漏</th><th>建議補件</th><th>人工處理</th></tr>'+list.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.assessment)}</td><td>${esc(x.support)}<p class="muted">證據 ID：${esc(x.evidence_ids)}</p></td><td>${esc(x.gap)}</td><td>${esc(x.request_text)}</td><td><button class="alt" onclick="applyAISuggestion('${esc(x.code)}')">帶入人工檢核表</button></td></tr>`).join('')+'</table></div>':'<p class="muted">尚未執行 AI 分析。</p>'}
async function applyAISuggestion(code){let list=await api('/projects/'+current+'/ai/suggestions');let x=list.find(v=>v.code===code);if(!x)return;let ids=JSON.parse(x.evidence_ids||'[]');$('clsrc-'+code).value=ids.join(',');$('clnote-'+code).value='【AI 初步建議，待人工確認】\n'+x.support+'\n疑似缺漏：'+x.gap+'\n建議補件：'+x.request_text;msg('已帶入，請自行選擇條文檢核狀態並按儲存。')}
function exportCompliance(){window.location.href='/api/projects/'+current+'/compliance/export'}

init().catch(e=>msg(e.message));
</script></html>
