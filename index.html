<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>永續相關財務資訊專章工作台</title><style>

plate-columns:1fr}}
</style><header><h1>ESG 永續相關財務資訊專章工作台</h1><small>V7.1 · 專業顧問功能 · 整本專章撰寫 · 進度儀表板 · 來源追溯 · 修改歷程 · 資料備份</small></header><main><aside><h3>公司專案</h3><select id="projects" onchange="load()"></select><button onclick="create()">＋ 建立公司專案</button><button class="alt" id="deleteProjectButton" onclick="deleteCurrentProject()" style="color:#b42318;border:1px solid #e8b4ae">刪除目前公司專案</button><hr><nav id="nav"></nav><p class="muted">專案儲存在外部 PostgreSQL；仍須定期備份，免費方案不保證永久保存。參考文件僅用於設計架構，不作為企業證據。</p></aside><article><div id="message"></div><section id="overview" class="view"></section><section id="dashboard" class="view hidden"></section><section id="history" class="view hidden"></section><section id="professional" class="view hidden"></section><section id="upload" class="view hidden"></section><section id="chapters" class="view hidden"></section><section id="checks" class="view hidden"></section><section id="sources" class="view hidden"></section><section id="requests" class="view hidden"></section><section id="clauses" class="view hidden"></section></article></main><script>
const views=[['overview','專案總覽'],['dashboard','進度儀表板'],['history','修改歷程'],['professional','財務／審閱／邊界'],['upload','批次上傳與辨識'],['chapters','五大章節編輯'],['checks','專章架構檢查'],['sources','證據與來源追溯'],['requests','客戶索資追蹤'],['clauses','S1／S2 條文檢核']];let current=null,data=null,selected='overview';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,options){let r;try{r=await fetch('/api'+path,options)}catch(e){throw Error('無法連接系統後端。請確認網站部署成功並重新整理頁面。')}let j;try{j=await r.json()}catch(e){throw Error('伺服器回傳異常，請檢查部署日誌。')}if(!r.ok)throw Error(j.error||'操作失敗');return j}function msg(s){$('message').textContent=s;setTimeout(()=>$('message').textContent='',5500)}function tab(k){selected=k;for(let [id] of views)$(id).classList.toggle('hidden',id!==k);if(k==='dashboard')renderDashboard().catch(e=>msg(e.message));if(k==='history')renderHistory().catch(e=>msg(e.message));if(k==='professional')renderProfessional().catch(e=>msg(e.message));if(k==='requests'||k==='clauses'){renderCompliance().then(()=>{if(k==='clauses')showAISuggestions()}).catch(e=>msg(e.message))} $('nav').innerHTML=views.map(([id,label])=>`<button class="${id===k?'active':''}" onclick="tab('${id}')">${label}</button>`).join('')}async function init(){let ps=await api('/projects');$('projects').innerHTML=ps.map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.year)}</option>`).join('');if(ps.length){current=Number($('projects').value);await refresh()}else{tab('overview');$('overview').innerHTML='<div class="panel"><h2>尚無專案</h2><p>請點左側「建立公司專案」開始。</p></div>'}}async function deleteCurrentProject(){
 if(!current||!data?.project){alert('請先選擇公司專案');return}
 const p=data.project;
 if(!confirm(`確定要永久刪除「${p.name}」（${p.year}）嗎？\n\n這將一併刪除該公司的上傳來源、原始檔、解析證據、草稿、索資紀錄、條文檢核與 AI 建議。\n此操作無法復原。`))return;
 const typed=prompt(`請輸入公司名稱「${p.name}」以確認永久刪除：`);
 if(typed===null)return;
 if(typed!==p.name){alert('公司名稱不一致，已取消刪除。');return}
 const button=$('deleteProjectButton');button.disabled=true;
 try{
  await api('/projects/'+current,{method:'DELETE'});
  current=null;data=null;selected='overview';
  await init();
  msg('公司專案及其相關資料已刪除');
 }catch(e){alert('刪除失敗：'+e.message)}finally{button.disabled=false}
}
async function create(){let name=prompt('公司名稱（不得使用參考公司作為資料來源）');if(!name)return;let industry=prompt('產業別（選填）','')||'';let year=prompt('報導年度','2025')||'2025';try{let p=await api('/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,industry,year})});await init();$('projects').value=p.id;await load();tab('upload');msg('專案建立成功，下一步請上傳企業資料。')}catch(e){alert('建立專案失敗：'+e.message);msg(e.message)}}async function load(){current=Number($('projects').value);await refresh()}async function refresh(){if(!current)return;data=await api('/projects/'+current);render();tab(selected)}function render(){let c=data.checks,n=c.length,has=c.filter(x=>x.evidence).length,generated=c.filter(x=>x.generated).length,confirmed=c.filter(x=>x.confirmed).length;
$('overview').innerHTML=`<div class="panel"><h2>${esc(data.project.name)}｜${esc(data.project.year)}</h2><p class="muted">產業：${esc(data.project.industry||'尚未設定')}。資料完整度與準則符合程度不可混用。</p><div class="stats"><div class="stat">參考架構項目<strong>${n}/${n}</strong><small>已建置章節，不代表已揭露</small></div><div class="stat">企業資料支持<strong>${has}/${n}</strong><small>僅為初步關鍵字分類，待人工審查</small></div><div class="stat">已人工確認<strong>${confirmed}/${n}</strong><small>準則符合程度：未評估</small></div></div><p>已生成可審閱內容：${generated}/${n}　｜　來源檔案：${data.sources.length}　｜　證據片段：${data.evidence.length}</p><button onclick="tab('upload')">上傳資料</button><button class="alt" id="aiTestBtn" onclick="testAIConnection()">測試 Groq 連線（不傳企業資料）</button><pre id="aiTestResult" class="muted" style="white-space:pre-wrap"></pre><div class="row"><label for="chapterSelect">選擇撰寫範圍</label><select id="chapterSelect"><option value="1">第 1 章｜前言</option><option value="2">第 2 章｜治理</option><option value="3">第 3 章｜策略</option><option value="4">第 4 章｜風險管理</option><option value="5">第 5 章｜指標與目標</option><option value="all">整本（建議分章執行）</option></select><button id="reportGenerateButton" onclick="generate()">AI 分章撰寫／接續</button></div><div id="reportProgress" role="status" aria-live="polite" class="muted">將依企業證據逐節撰寫完整報告段落、管理措施、指標／目標／績效表格與未來規劃；既有正文不覆寫。完成後可匯出整本 Word（含目錄、待補清單、來源及 IFRS 檢核附錄）。生成可能需要數分鐘，請勿重複點擊。</div><button class="alt" onclick="tab('checks')">檢查缺口</button><h3>匯出報告與補件清單</h3><button onclick="exportFile('docx')">Word</button><button class="alt" onclick="backupProject()">備份專案 ZIP</button><button onclick="exportFile('pdf')">PDF</button><button onclick="exportFile('xlsx')">Excel 缺口／來源</button><p class="muted">AI 依已解析的企業證據撰寫可編輯草稿，未有資料的章節會標示待補充；不代表 IFRS 合規，須人工核對。</p></div>`;
$('upload').innerHTML=`<div class="panel"><h2>批次上傳企業資料</h2><p>支援 PDF（文字型）、DOCX、XLSX、TXT、CSV、MD。可一次選擇多份，系統逐檔上傳，單一檔案失敗不影響其他檔案；掃描影像、舊版 DOC、PPTX 尚不支援。</p><input id="files" type="file" multiple accept=".pdf,.docx,.xlsx,.xlsm,.txt,.csv,.md"><button id="uploadButton" onclick="uploadFiles()">解析並分類</button><div id="uploadProgress" role="status" aria-live="polite"></div><p class="muted">來源檔案經 SHA-256 去重；解析後儲存原文片段、頁碼或工作表位置與分類信心。原始檔案保存至 PostgreSQL，並可下載；資料庫容量有限，請定期備份。</p></div><div class="panel"><h3>直接新增文字段落</h3><input id="textname" placeholder="來源名稱，例如：2025年氣候風險訪談"><textarea id="textbody" placeholder="貼上客戶訪談紀錄、文字敘述、數據說明等"></textarea><button onclick="addText()">儲存文字來源</button></div><div class="panel"><h3>已匯入檔案</h3>${data.sources.map(s=>`<div class="section"><b>#${s.id} ${esc(s.name)}</b><p class="muted">${esc(s.created)}</p><select id="srcstatus-${s.id}"><option value="yellow" ${s.status==='yellow'?'selected':''}>🟡 已上傳／待人工確認</option><option value="green" ${s.status==='green'?'selected':''}>🟢 人工已確認</option><option value="red" ${s.status==='red'?'selected':''}>🔴 有問題需修改</option></select><input id="srcnote-${s.id}" value="${esc(s.note)}" placeholder="審核備註或問題原因"><button onclick="saveSource(${s.id})">儲存燈號</button><button class="alt" onclick="window.location.href='/api/projects/'+current+'/sources/${s.id}/download'">下載原始檔</button><button class="alt" onclick="removeSource(${s.id})">刪除來源</button></div>`).join('')||'尚無檔案'}</div>`;
let chapters='';for(let [ch,[title,subs]] of Object.entries(data.structure)){chapters+=`<div class="panel"><h2>${ch}｜${title}</h2>`;subs.forEach((sub,i)=>{let k=ch+'.'+(i+1),r=data.drafts[k],count=c.find(x=>x.key===k)?.evidence||0;chapters+=`<div class="section"><div class="row"><strong>${k} ${esc(sub)}</strong><span class="tag">證據 ${count}</span><span class="tag">${r?.confirmed?'已確認':'待審核'}</span></div><pre>${esc((r?.body||'[尚未生成]').slice(0,350))}</pre><button class="alt" onclick="viewSection('${k}')">閱讀全文</button><button class="alt" onclick="editSection('${k}')">編輯／確認</button></div>`});chapters+='</div>'}$('chapters').innerHTML=chapters;
$('checks').innerHTML=`<div class="panel"><h2>專章架構檢查</h2><p>參考架構完整度：${n}/${n}（系統模板）｜企業資料支持：${has}/${n}｜已確認：${confirmed}/${n}｜<b>IFRS S1/S2 符合程度：未評估</b></p><div class="scroll"><table><thead><tr><th>統一章節／揭露項目</th><th>企業證據</th><th>已生成</th><th>待補充</th><th>人工判斷</th><th>準則狀態</th></tr></thead><tbody>${c.map(x=>`<tr><td>${x.key} ${esc(x.title)}</td><td>${x.evidence} 筆</td><td>${x.generated?'是':'否'}</td><td>${x.needs_data?'缺來源':'待確認適用性'}</td><td>${x.confirmed?'完成':'待審核'}</td><td>未確認適用條文</td></tr>`).join('')}</tbody></table></div><p class="muted">本頁只做架構與資料缺口檢查；IFRS 準則條文及產業適用性需要專業逐項判斷，不能以章節有文字判定合規。</p></div>`;
$('sources').innerHTML=`<div class="panel"><h2>來源追溯與章節對應</h2><div class="scroll">${data.evidence.map(e=>`<div class="section"><strong>#${e.id} ${esc(e.filename)}</strong><p class="muted">${esc(e.location)}｜${e.category}｜信心 ${e.confidence}｜章節：${esc(e.sections.join(', ')||'未分類')}</p><pre>${esc(e.body.slice(0,500))}</pre><button class="alt" onclick="remap(${e.id})">修正章節對應</button><button class="alt" onclick="editEvidence(${e.id})">修改文字片段</button></div>`).join('')||'尚無證據'}</div></div>`}
let uploadBusy=false;
async function watchJob(pid,jid,output){
 for(let attempt=0;attempt<180;attempt++){
  await new Promise(resolve=>setTimeout(resolve,1800));
  const j=await api('/projects/'+pid+'/jobs/'+jid);
  if(output)output.textContent=`${j.progress}%｜${j.message}`;
  if(j.status==='done'||j.status==='error')return j;
 }
 return {status:'pending',message:'處理仍在進行，請稍後重新整理；背景工作若遇主機重啟可能中斷。'};
}
async function uploadFiles(){
 if(uploadBusy)return;
 const files=Array.from($('files')?.files||[]);if(!files.length)return msg('請先選擇檔案');
 const pid=current,progress=$('uploadProgress'),btn=$('uploadButton');uploadBusy=true;
 btn.disabled=true;btn.textContent='正在逐檔上傳…';
 const lines=[];
 try{
  // 逐檔送出：避免一次大請求超過 Render 的 40MB 限制，也讓單一失敗不影響其他檔案。
  for(let i=0;i<files.length;i++){
   const f=files[i];progress.textContent=`上傳 ${i+1}/${files.length}：${f.name}\n`+lines.join('\n');
   const fd=new FormData();fd.append('files',f);
   try{
    const r=await api('/projects/'+pid+'/upload',{method:'POST',body:fd});
    const item=r.results?.[0];lines.push(`${f.name}：${item?.status||'已送出'}`);
   }catch(e){lines.push(`${f.name}：失敗 - ${e.message}`)}
  }
  progress.textContent=lines.join('\n')+'\n已送出解析工作，稍後可重新整理查看證據數量。';
  if(current===pid)await refresh();
  msg('批次上傳已送出，解析在背景進行；不必停留此頁等待。');
 }finally{uploadBusy=false;const b=$('uploadButton');if(b){b.disabled=false;b.textContent='解析並分類'}}
}

let reportBusy=false;
async function testAIConnection(){
 const b=$('aiTestBtn'),out=$('aiTestResult');if(!b||!out)return;
 b.disabled=true;out.textContent='正在測試 Groq（固定短文字，不傳送企業資料）…';
 try{
  const result=await api('/ai/connection-test',{method:'POST'});
  out.textContent=JSON.stringify(result,null,2);
 }catch(e){out.textContent='測試未完成：'+e.message}
 finally{b.disabled=false}
}
async function generate(){
 if(reportBusy)return;
 reportBusy=true;
 let btn=document.getElementById('reportGenerateButton');
 let progress=document.getElementById('reportProgress');
 if(btn){btn.disabled=true;btn.textContent='AI 正在撰寫…';}
 if(progress)progress.textContent='正在啟動 AI 報告撰寫，請稍候…';
 try{
  const pid=current;
  const chapter=document.getElementById('chapterSelect')?.value||'1';
  const r=await api('/projects/'+pid+'/report/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chapter:chapter==='all'?null:chapter})});
  for(let i=0;i<450;i++){
   await new Promise(resolve=>setTimeout(resolve,2000));
   const job=await api('/projects/'+pid+'/jobs/'+r.job_id);
   if(progress)progress.textContent=`${job.message}（${job.progress}%）`;
   if(job.status==='done'){
    await refresh();tab('chapters');msg('整本永續專章草稿已完成！可點 Word 下載整本報告，並逐節核對來源與待補資料。');return;
   }
   if(job.status==='error')throw Error(job.message||'AI 撰寫失敗');
  }
  throw Error('等待超過 15 分鐘，請查看 Render Logs；已生成的章節不會自動刪除。');
 }catch(e){msg('AI 生成失敗：'+e.message);if(progress)progress.textContent='失敗：'+e.message;}
 finally{reportBusy=false;if(btn){btn.disabled=false;btn.textContent='AI 分章撰寫／接續';}}
}function exportFile(fmt){window.location.href='/api/projects/'+current+'/export/'+fmt}async function editSection(k){let r=data.drafts[k]||{};let body=prompt('修改本節文字（按確定後儲存；請自行核對來源）',r.body||'');if(body===null)return;let confirmed=confirm('是否標示為「已人工確認」？\n請先確認內容與來源、適用性、期間與數值一致。');await api('/projects/'+current+'/sections/'+k,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({body,confirmed})});await refresh();tab('chapters')}async function remap(id){let e=data.evidence.find(x=>x.id===id);let s=prompt('以逗號分隔章節編號，例如 3.1,4.3',e.sections.join(','));if(s===null)return;await api('/projects/'+current+'/evidence/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({sections:s.split(',').map(x=>x.trim())})});await refresh();tab('sources')}

async function saveSource(id){try{await api('/projects/'+current+'/sources/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('srcstatus-'+id).value,note:$('srcnote-'+id).value})});msg('文件狀態已儲存');await refresh()}catch(e){alert(e.message)}}
async function removeSource(id){
 if(!confirm('確定刪除來源及其證據片段？既有草稿不會自動清除。'))return;
 const pid=current,button=document.activeElement;if(button){button.disabled=true;button.textContent='刪除中…'}
 try{
  await api('/projects/'+pid+'/sources/'+id,{method:'DELETE'});
  // 先在畫面移除檔案，避免重新下載整份專案資料造成操作卡頓。
  if(current===pid&&data){data.sources=data.sources.filter(s=>s.id!==id);data.evidence=data.evidence.filter(e=>e.source!==id);render();tab('upload')}
  msg('來源已刪除；草稿中引用過的文字請人工複核。');
 }catch(e){if(button){button.disabled=false;button.textContent='刪除來源'}alert(e.message)}
}
async function addText(){let body=$('textbody').value.trim();if(!body)return alert('請輸入文字');try{await api('/projects/'+current+'/text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('textname').value,body})});await refresh();msg('文字已新增，預設黃燈')}catch(e){alert(e.message)}}
async function editEvidence(id){let e=data.evidence.find(x=>x.id===id);let body=prompt('編輯文字片段（綠燈來源需先改黃燈）',e.body);if(body===null)return;try{await api('/projects/'+current+'/evidence/'+id+'/text',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});await refresh();msg('文字已更新')}catch(e){alert(e.message)}}

async function renderCompliance(){
 const d=await api('/projects/'+current+'/compliance');
 const statuses={'missing':'未提供','received':'🟡 已上傳／待確認','confirmed':'🟢 已確認','issue':'🔴 有問題','not_applicable':'不適用'};
 const cs={'unreviewed':'未檢核','missing':'未揭露','partial':'部分揭露','complete':'人工確認已揭露','not_applicable':'不適用'};
 const sourceOptions=(selected)=>'<option value="">未指定</option>'+data.sources.map(s=>`<option value="${s.id}" ${String(selected)===String(s.id)?'selected':''}>#${s.id} ${esc(s.name)}</option>`).join('');
 $('requests').innerHTML=`<div class="panel"><h2>客戶索資追蹤</h2><p class="muted">${esc(d.version)}。文件狀態與條文符合性分開判斷；索資清單含額外顧問盡職調查項目，並非每項均為 IFRS 強制揭露。</p><div class="stats"><div class="stat">索資項目<strong>${d.summary.requests_total}</strong></div><div class="stat">尚未提供<strong>${d.summary.requests_missing}</strong></div><div class="stat">已收到／待確認<strong>${d.requests.filter(x=>x.status==='received').length}</strong></div></div><button onclick="exportCompliance()">下載索資＋條文檢核 Excel</button><div class="scroll"><table><thead><tr><th>編號／類別</th><th>索取資料及參考條文</th><th>狀態</th><th>對應來源</th><th>備註／待補內容</th><th>操作</th></tr></thead><tbody>${d.requests.map(x=>`<tr><td>${esc(x.code)}<p class="muted">${esc(x.group)}</p></td><td>${esc(x.title)}<p class="muted">${esc(x.clauses)}｜章節 ${esc(x.section)}</p></td><td><select id="reqs-${x.code}">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><select id="reqsrc-${x.code}">${sourceOptions(x.source_id)}</select></td><td><textarea id="reqnote-${x.code}" style="min-height:72px">${esc(x.note)}</textarea></td><td><button onclick="saveRequest('${x.code}')">儲存</button></td></tr>`).join('')}</tbody></table></div></div>`;
 $('clauses').innerHTML=`<div class="panel"><h2>IFRS S1／S2 條文檢核</h2><p class="muted">${esc(d.version)}。此處為重點條文檢核，不是完整條文清單。未檢核不等於不符合；已人工確認也不代表取得第三方確信。</p><div class="stats"><div class="stat">檢核群組<strong>${d.summary.clauses_total}</strong></div><div class="stat">人工確認已揭露<strong>${d.summary.clauses_complete}</strong></div><div class="stat">確認缺漏／部分揭露<strong>${d.summary.clauses_gaps}</strong></div></div><button onclick="runAI()">AI 分析文件並提出條文缺漏</button><p class="muted">AI 建議不會自動改為已確認，請人工核對。</p><div id="aiSuggestions"></div><button onclick="exportCompliance()">下載 Excel 補件清單</button><div class="scroll"><table><thead><tr><th>準則條文</th><th>揭露要求</th><th>人工判斷</th><th>來源文件（可填多個 ID）</th><th>缺漏／應向客戶索取</th><th>操作</th></tr></thead><tbody>${d.checks.map(x=>`<tr><td><b>${esc(x.code)}</b><p class="muted">章節 ${esc(x.section)}</p></td><td>${esc(x.title)}<p class="muted">${esc(x.requirement)}</p></td><td><select id="clstatus-${x.code}">${Object.entries(cs).map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><input id="clsrc-${x.code}" value="${esc(x.source_ids.join(','))}" placeholder="如 1,3"></td><td><textarea id="clnote-${x.code}" style="min-height:72px">${esc(x.note)}</textarea></td><td><button onclick="saveClause('${x.code}')">儲存</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
async function saveRequest(code){try{await api('/projects/'+current+'/compliance/request/'+code,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('reqs-'+code).value,source_id:$('reqsrc-'+code).value||null,note:$('reqnote-'+code).value})});msg('索資項目已儲存');await renderCompliance()}catch(e){alert(e.message)}}
async function saveClause(code){try{let raw=$('clsrc-'+code).value.trim();let ids=raw?raw.split(',').map(x=>Number(x.trim())):[];if(ids.some(x=>!Number.isInteger(x)||x<=0))throw Error('來源 ID 請輸入數字，以逗號分隔');await api('/projects/'+current+'/compliance/clause/'+encodeURIComponent(code),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('clstatus-'+code).value,source_ids:ids,note:$('clnote-'+code).value})});msg('條文檢核已儲存');await renderCompliance()}catch(e){alert(e.message)}}
let aiBusy=false;
async function runAI(){
 if(aiBusy)return;
 if(!confirm('將本專案已解析文字片段傳送至 OpenAI API 進行分析，可能產生費用。請確認資料傳送權限。繼續？'))return;
 aiBusy=true;const pid=current;msg('AI 已排入背景處理…');
 try{
  const j=await api('/projects/'+pid+'/ai/start',{method:'POST'});
  const result=await watchJob(pid,j.job_id,null);
  if(result.status==='error')throw Error(result.message);
  if(result.status==='done'){msg(result.message);if(current===pid)await showAISuggestions()}
  else msg(result.message);
 }catch(e){alert('AI 分析失敗：'+e.message)}finally{aiBusy=false}
}
async function showAISuggestions(){let list=await api('/projects/'+current+'/ai/suggestions');let el=$('aiSuggestions');if(!el)return;el.innerHTML=list.length?'<h3>AI 初步建議（非符合性結論）</h3><div class="scroll"><table><tr><th>條文</th><th>初步判斷</th><th>來源證據</th><th>疑似缺漏</th><th>建議補件</th><th>人工處理</th></tr>'+list.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.assessment)}</td><td>${esc(x.support)}<p class="muted">證據 ID：${esc(x.evidence_ids)}</p></td><td>${esc(x.gap)}</td><td>${esc(x.request_text)}</td><td><button class="alt" onclick="applyAISuggestion('${esc(x.code)}')">帶入人工檢核表</button></td></tr>`).join('')+'</table></div>':'<p class="muted">尚未執行 AI 分析。</p>'}
async function applyAISuggestion(code){let list=await api('/projects/'+current+'/ai/suggestions');let x=list.find(v=>v.code===code);if(!x)return;let ids=JSON.parse(x.evidence_ids||'[]');$('clsrc-'+code).value=ids.join(',');$('clnote-'+code).value='【AI 初步建議，待人工確認】\n'+x.support+'\n疑似缺漏：'+x.gap+'\n建議補件：'+x.request_text;msg('已帶入，請自行選擇條文檢核狀態並按儲存。')}
function exportCompliance(){window.location.href='/api/projects/'+current+'/compliance/export'}

init().catch(e=>msg(e.message));

function backupProject(){if(!current)return;window.location.href='/api/projects/'+current+'/backup'}
async function renderDashboard(){if(!current)return;const d=await api('/projects/'+current+'/dashboard');const s=d.summary;const pct=(v,t)=>t?Math.round(100*v/t):0;const bar=(v,t)=>`<div style="height:9px;background:#e5efeb;border-radius:9px;overflow:hidden"><div style="width:${pct(v,t)}%;height:100%;background:#176c5d"></div></div>`;
$('dashboard').innerHTML=`<div class="panel"><h2>章節整備進度</h2><p class="muted">${esc(d.note)}</p><div class="stats"><div class="stat">已生成正文<strong>${s.generated}/${s.total}</strong>${bar(s.generated,s.total)}</div><div class="stat">有分類證據<strong>${s.supported}/${s.total}</strong>${bar(s.supported,s.total)}</div><div class="stat">已人工確認<strong>${s.confirmed}/${s.total}</strong>${bar(s.confirmed,s.total)}</div></div></div>`+d.chapters.map(ch=>`<div class="panel"><h3>${esc(ch.chapter)}｜${esc(ch.title)}</h3><p class="muted">正文 ${ch.generated}/${ch.total}｜有證據 ${ch.supported}/${ch.total}｜人工確認 ${ch.confirmed}/${ch.total}</p>${bar(ch.generated,ch.total)}<div class="scroll"><table><tr><th>章節</th><th>狀態</th><th>來源片段</th><th>查看</th></tr>${ch.items.map(x=>`<tr><td>${esc(x.key)} ${esc(x.title)}</td><td>${esc(x.status)}</td><td>${x.evidence}</td><td><button class="alt" onclick="viewSection('${x.key}')">全文</button></td></tr>`).join('')}</table></div></div>`).join('')}
function viewSection(key){const r=data?.drafts?.[key];if(!r){alert('尚無正文，請先生成或補充資料');return}const win=window.open('','_blank');if(!win){alert('瀏覽器阻擋新視窗，請允許彈出視窗');return}win.document.title=key+' 永續專章正文';const safe=esc(r.body||'').replace(/\n/g,'<br>');win.document.body.innerHTML='<meta charset="utf-8"><style>body{max-width:850px;margin:40px auto;font:16px/1.85 system-ui,sans-serif;color:#243c35;padding:20px}h1{font-size:22px}article{white-space:normal;overflow-wrap:anywhere}</style><h1>'+esc(key)+'｜永續資訊專章正文</h1><article>'+safe+'</article>'}
async function renderHistory(){if(!current)return;const rows=await api('/projects/'+current+'/audit');$('history').innerHTML=`<div class="panel"><h2>人工修改歷程</h2><p class="muted">記錄 V7.0 上線後透過章節編輯功能進行的修改。舊版本修改無法回溯；目前使用共用帳號，因此不能辨識實際個人。</p><div class="scroll"><table><tr><th>時間</th><th>章節</th><th>確認狀態</th><th>修改前</th><th>修改後</th></tr>${rows.map(x=>`<tr><td>${esc(x.changed)}</td><td>${esc(x.section)}</td><td>${x.old_confirmed?'已確認':'未確認'} → ${x.new_confirmed?'已確認':'未確認'}</td><td>${esc((x.old_body||'').slice(0,300))}</td><td>${esc((x.new_body||'').slice(0,300))}</td></tr>`).join('')||'<tr><td colspan="5">尚無 V7.0 人工修改紀錄</td></tr>'}</table></div></div>`}

async function renderProfessional(){
 if(!current)return;
 const d=await api('/projects/'+current+'/professional');
 const keys=(data?.checks||[]).map(x=>x.key).filter(Boolean);
 const opts=keys.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('');
 $('professional').innerHTML=`<div class="panel"><h2>專業顧問與會計實務工作區</h2><p class="muted">新增資料不會自動改寫報告正文。財務試算僅供情境分析，非公司已發生的財務影響；所有揭露仍需人工核對。</p></div>
 <div class="panel"><h3>審閱評語與退回補件</h3><div class="row"><div class="grow"><label>章節</label><select id="reviewSection">${opts}</select></div><div class="grow"><label>審閱人員（自行填寫，尚無個別帳號驗證）</label><input id="reviewer" placeholder="例如：會計師／顧問"></div></div><textarea id="reviewComment" style="min-height:95px" placeholder="請補充佐證、修正原因或審閱意見"></textarea><button onclick="addReview()">新增評語</button><div class="scroll"><table><tr><th>章節</th><th>審閱人</th><th>評語</th><th>狀態</th><th>操作</th></tr>${d.comments.map(x=>`<tr><td>${esc(x.section)}</td><td>${esc(x.reviewer)}<p class="muted">${esc(x.created)}</p></td><td>${esc(x.comment)}</td><td>${x.status==='resolved'?'已處理':'待處理'}</td><td><button class="alt" onclick="setReview(${x.id},'${x.status==='resolved'?'open':'resolved'}')">${x.status==='resolved'?'重新開啟':'標記已處理'}</button></td></tr>`).join('')||'<tr><td colspan="5">尚無審閱評語</td></tr>'}</table></div></div>
 <div class="panel"><h3>集團／子公司與揭露邊界登錄</h3><p class="muted">分別記錄財務合併範圍及溫室氣體盤查邊界；不會自動認定兩者一致。</p><input id="entityName" placeholder="公司／子公司名稱"><select id="entityScope"><option>財務報表合併邊界</option><option>溫室氣體盤查邊界</option><option>其他揭露邊界</option></select><select id="entityMethod"><option>合併財務報表範圍</option><option>營運控制法</option><option>財務控制法</option><option>股權比例法</option><option>其他／待確認</option></select><input id="entityNote" placeholder="納入比例、期間、排除原因（選填）"><button onclick="addEntity()">新增邊界紀錄</button><div class="scroll"><table><tr><th>單位</th><th>邊界</th><th>方法</th><th>備註</th></tr>${d.entities.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.scope)}</td><td>${esc(x.method)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div></div>
 <div class="panel"><h3>永續事項 × 財務報表科目對應</h3><div class="row"><div class="grow"><label>揭露章節</label><select id="linkSection">${opts}</select></div><div class="grow"><label>永續事項</label><input id="linkItem" placeholder="例如：節能設備投資"></div></div><div class="row"><div class="grow"><label>財報科目</label><input id="linkAccount" placeholder="例如：不動產、廠房及設備"></div><div class="grow"><label>金額</label><input id="linkAmount" type="number" step="any" placeholder="實際金額"></div><div><label>幣別</label><select id="linkCurrency"><option>TWD</option><option>USD</option><option>EUR</option><option>JPY</option><option>CNY</option></select></div></div><label>佐證來源</label><select id="linkSource"><option value="">未指定</option>${(data?.sources||[]).map(x=>`<option value="${x.id}">#${x.id} ${esc(x.name)}</option>`).join('')}</select><input id="linkNote" placeholder="計算依據、財報期間或待確認事項"><button onclick="addLink()">新增財報對應</button><div class="scroll"><table><tr><th>章節</th><th>永續事項</th><th>財報科目</th><th>金額</th><th>來源</th></tr>${d.links.map(x=>`<tr><td>${esc(x.section)}</td><td>${esc(x.item)}</td><td>${esc(x.account)}</td><td>${Number(x.amount).toLocaleString()} ${esc(x.currency)}</td><td>${esc(x.source_id||'待補')}</td></tr>`).join('')}</table></div></div>
 <div class="panel"><h3>碳費情境試算（示例，非官方費率）</h3><p class="muted">使用者自訂排放量及單價。試算未納入免費額度、優惠費率、適用門檻、稅務效果或其他法規條件；不代表實際應繳碳費。</p><label>納入試算的排放量（tCO₂e）</label><input id="scenarioTons" type="number" min="0" step="any" value="1000"><label>基準 EBITDA（新臺幣元，選填）</label><input id="scenarioEbitda" type="number" step="any" placeholder="選填"><label>自訂費率（元／tCO₂e，以逗號分隔）</label><input id="scenarioRates" value="300,500,1000"><button onclick="calcScenario()">計算情境</button><div id="scenarioResult"></div></div>
 <div class="panel"><h3>跨章節一致性提醒</h3><button onclick="checkConsistency()">檢查策略、指標與目標</button><div id="consistencyResult" class="muted">此功能使用關鍵字比對，結果僅供人工查核。</div></div>`;
}
async function addReview(){try{await api('/projects/'+current+'/professional/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({section:$('reviewSection').value,reviewer:$('reviewer').value,comment:$('reviewComment').value})});await renderProfessional();msg('評語已儲存')}catch(e){alert(e.message)}}
async function setReview(id,status){try{await api('/projects/'+current+'/professional/comments/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await renderProfessional()}catch(e){alert(e.message)}}
async function addEntity(){try{await api('/projects/'+current+'/professional/entities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('entityName').value,scope:$('entityScope').value,method:$('entityMethod').value,note:$('entityNote').value})});await renderProfessional();msg('邊界已登錄')}catch(e){alert(e.message)}}
async function addLink(){try{await api('/projects/'+current+'/professional/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({section:$('linkSection').value,item:$('linkItem').value,account:$('linkAccount').value,amount:$('linkAmount').value,currency:$('linkCurrency').value,source_id:$('linkSource').value,note:$('linkNote').value})});await renderProfessional();msg('財務科目對應已儲存')}catch(e){alert(e.message)}}
function calcScenario(){const tons=Number($('scenarioTons').value),raw=$('scenarioRates').value.split(',').map(x=>Number(x.trim())),ebitda=$('scenarioEbitda').value.trim();if(!Number.isFinite(tons)||tons<0||!raw.length||raw.some(x=>!Number.isFinite(x)||x<0))return alert('請輸入非負的排放量與費率');if(ebitda!==''&&!Number.isFinite(Number(ebitda)))return alert('EBITDA 格式不正確');$('scenarioResult').innerHTML='<table><tr><th>自訂費率</th><th>情境成本（元）</th><th>假設其他條件不變的 EBITDA（元）</th></tr>'+raw.map(rate=>{const cost=tons*rate;return `<tr><td>${rate.toLocaleString()}</td><td>${cost.toLocaleString()}</td><td>${ebitda===''?'未提供':(Number(ebitda)-cost).toLocaleString()}</td></tr>`}).join('')+'</table>'}
async function checkConsistency(){try{const d=await api('/projects/'+current+'/professional/consistency');$('consistencyResult').innerHTML='<p>'+esc(d.note)+'</p>'+(d.warnings.map(x=>`<p>⚠️ ${esc(x.title)}：${esc(x.message)}</p>`).join('')||'<p>未發現預設關鍵字規則所涵蓋的疑點；不代表內容一致或已符合準則。</p>')}catch(e){alert(e.message)}}
</script></html>
